version: '3.8'

services:
  network-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network-config-manager
    volumes:
      - ./config:/etc/network-config
      - ./logs:/var/log
      - ./examples:/app/examples
    environment:
      - CONFIG_PATH=/etc/network-config/network.yml
      - LOG_LEVEL=info
      - LOG_FILE=/var/log/network-config.log
    ports:
      - "8080:8080"
      - "8443:8443"
    restart: unless-stopped
    networks:
      - network-config-net

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: network-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - network-config-net

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: network-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - network-config-net

networks:
  network-config-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
